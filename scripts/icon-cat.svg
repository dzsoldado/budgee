<!-- The app icon's drawing: a cat in round glasses doing the books, sitting on its hind feet,
     peering down at the invoices in one paw while the other counts a stack of coins, on a
     transparent 512 square. gen-icons.ts puts it on the primary-color background at each icon's
     size. Its ink bounds, outlines included, are x 26–480, y 38–491 (center 253.5, 265): update ART_CENTER
     and ART_FEET in gen-icons.ts after moving it. The silhouette shapes are listed twice, fat in
     ink and then filled, so tail, feet, body, ears, cheek tufts and head merge into one outlined
     body. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<title>Budgee app icon drawing</title>
<defs>
  <clipPath id="cat-body"><ellipse cx="256" cy="372" rx="146" ry="94"/></clipPath>
  <clipPath id="cat-eye-l"><ellipse cx="208" cy="208" rx="22" ry="24"/></clipPath>
  <clipPath id="cat-eye-r"><ellipse cx="304" cy="208" rx="22" ry="24"/></clipPath>
  <g id="cat-invoice">
    <path d="M-58-74h86l30 30v118h-116Z" fill="#ffffff" stroke="#2a1260" stroke-width="9"/>
    <path d="M28-74v30h30" fill="#e4e0ef" stroke="#2a1260" stroke-width="7"/>
    <rect x="-42" y="-58" width="48" height="14" rx="4" fill="#5b2bb8"/>
    <path d="M-40-22h80M-40-6h56M-40 10h72M-40 26h40" fill="none" stroke="#c9c4d8" stroke-width="7"/>
    <path d="M-40 44h80" fill="none" stroke="#2a1260" stroke-width="4"/>
    <path d="M6 60h34" fill="none" stroke="#3f9a59" stroke-width="9"/>
  </g>
  <g id="cat-coin">
    <path d="M-46 0v16a46 14 0 0 0 92 0v-16" fill="#e89a12" stroke="#2a1260" stroke-width="7"/>
    <ellipse rx="46" ry="14" fill="#ffc53d" stroke="#2a1260" stroke-width="7"/>
  </g>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
  <g fill="#2a1260" stroke="#2a1260" stroke-width="24">
    <path d="M384 432C452 430 470 370 446 330" fill="none" stroke-width="50"/>
    <rect x="166" y="430" width="66" height="50" rx="24"/>
    <rect x="280" y="430" width="66" height="50" rx="24"/>
    <ellipse cx="256" cy="372" rx="146" ry="94"/>
    <path d="M150 140L160 50L228 108Z"/>
    <path d="M362 140L352 50L284 108Z"/>
    <path d="M136 206L104 220L128 230L108 246L140 252Z"/>
    <path d="M376 206L408 220L384 230L404 246L372 252Z"/>
    <ellipse cx="256" cy="204" rx="128" ry="102"/>
  </g>
