  <use href="#cat-coin" transform="translate(378 414)"/>
  <use href="#cat-coin" transform="translate(378 396)"/>
  <!-- Paws, over the invoices and the top coin -->
  <ellipse cx="156" cy="420" rx="36" ry="26" fill="#c9c4d8" stroke="#2a1260" stroke-width="9"/>
  <path d="M144 402v14M166 402v14" stroke="#2a1260" stroke-width="5"/>
  <ellipse cx="368" cy="384" rx="36" ry="24" fill="#c9c4d8" stroke="#2a1260" stroke-width="9"/>
  <path d="M356 368v14M378 368v14" stroke="#2a1260" stroke-width="5"/>
</g>
